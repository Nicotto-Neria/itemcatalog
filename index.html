if(isGacha(x)&&["白ガチャ","黒ガチャ","色ガチャ","青ガチャ"].includes(x.cat)){const prev=list[list.indexOf(x)-1];if(!prev||monthOf(prev)!==month||prev.round!==x.round){const sub=document.createElement("h4");sub.textContent=x.round?"第"+roundNumber(x.round)+"弾":"弾数未確認";sub.style.cssText="grid-column:1/-1;margin:8px 0 0;padding:7px 0;color:#777;border-bottom:1px dashed #ddd";grid.append(sub)}}
if(isGacha(x)){
const group=gachaGroup(x),round=["白ガチャ","黒ガチャ","色ガチャ","青ガチャ"].includes(x.cat)?x.round:null;

}
const card=document.createElement("article");card.className="item";const img=document.createElement("img");if(x.img)img.src=x.img;img.alt=x.name;const body=document.createElement("div");body.className="body";const name=document.createElement("div");name.className="name";name.textContent=x.name;const meta=document.createElement("div");meta.className="meta";meta.textContent=(x.color?x.color+" ・ ":"")+(isGacha(x)?x.cat+(["白ガチャ","黒ガチャ","色ガチャ","青ガチャ"].includes(x.cat)?(x.round?" 第"+roundNumber(x.round)+"弾":" ・ 弾数未確認"):""):month==="リサイクル"?"リサイクル品":isFree(x)?"無料アイテム":(x.release||"発売年月未確認"));body.append(name,meta);if(x.description){const desc=document.createElement("div");desc.className="meta";desc.textContent=x.description;body.append(desc)}if(x.video){card.classList.add("has-video");const mark=document.createElement("span");mark.className="video-mark";mark.textContent="▶ 動くアイテム・クリックで再生";body.append(mark);card.tabIndex=0;card.setAttribute("role","button");card.setAttribute("aria-label",x.name+"の動画を再生");card.onclick=()=>openVideo(x);card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openVideo(x)}}}card.append(img,body);grid.append(card)}
